# Prefix
set -g prefix C-b
bind C-b send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# copy-mode / paste relocated off [ and ] (those now navigate windows below).
# Mouse wheel also enters copy-mode (mouse on).
bind Enter copy-mode
bind P paste-buffer -p

# Pane Controls
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind -n C-M-PageUp split-window -h -c "#{pane_current_path}"
bind -n C-M-PageDown split-window -v -c "#{pane_current_path}"
bind -n C-M-Home split-window -h -c "#{pane_current_path}"
bind -n C-M-End kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

# Smart-splits.nvim: vim-aware pane switching
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind x kill-window
bind -n C-S-Home new-window -c "#{pane_current_path}"
bind -n C-S-End kill-window

bind -n C-S-PageUp next-window
bind -n C-S-PageDown previous-window

# Tab navigation with prefix + [ / ]
bind [ previous-window
bind ] next-window

# Session controls
bind S choose-tree -Zs
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session
bind X kill-session
bind -n C-M-S-Home new-session -c "#{pane_current_path}"
bind -n C-M-S-End kill-session

bind -n C-M-S-PageUp switch-client -p
bind -n C-M-S-PageDown switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Extended keys: needed for Ctrl+letter chords to survive transports that
# would otherwise collapse them (e.g., SSH → Win32 sshd → pwsh → wsl.exe,
# where C-h would arrive as raw 0x08 = Backspace). Kitty negotiates CSI u
# locally; here we tell tmux to advertise extended-key support to the
# outer terminal so Kitty keeps sending the unambiguous escape sequences.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'kitty*:extkeys'
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
setw -g aggressive-resize on
set -g detach-on-destroy off

# Allow inner shells to emit DCS pass-through (\ePtmux;...) escapes to the
# outer terminal (kitty). Off by default in tmux 3.3+ for security. We use
# this from fish to set the `IS_TMUX` kitty user var so kitty's ctrl+hjkl
# bindings yield to tmux when inside a session. See
# ~/.config/fish/conf.d/kitty-is-tmux.fish.
set -g allow-passthrough on

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'


# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue


# Kitty parity bindings
# Alt+H/L for tab (window) switching
bind -n M-h previous-window
bind -n M-l next-window

# F1 zoom toggle
bind -n F1 resize-pane -Z

# Swap pane in direction (prefix + Shift+H/J/K/L)
bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'

# Cycle layouts
bind Space next-layout
