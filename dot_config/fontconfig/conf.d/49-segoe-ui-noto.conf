<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Restore pre-fontconfig-2.18 behaviour for "Segoe UI".

    The 2026-06-11 update (fontconfig 2.17.1 -> 2.18.1 + adwaita-fonts)
    started resolving the literal family "Segoe UI" to Adwaita Sans via the
    system-ui prefer block in 60-latin.conf. Microsoft Teams (teams-for-linux)
    requests "Segoe UI" directly in its CSS, so its whole UI flipped to
    Adwaita Sans ("wrong but readable" font).

    Pin "Segoe UI" (and its siblings) back to the system sans, Noto Sans,
    matching what "Segoe UI Web", "Helvetica Neue" and the generic sans-serif
    already resolve to. This keeps Teams consistent with the rest of the desktop.

    Verify:  fc-match "Segoe UI"   ->  NotoSans-Regular.ttf
  -->
  <alias binding="strong">
    <family>Segoe UI</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Segoe UI Historic</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
</fontconfig>
