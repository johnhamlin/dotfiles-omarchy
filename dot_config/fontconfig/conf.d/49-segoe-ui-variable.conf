<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Make Microsoft Teams (teams-for-linux) render in real Segoe UI.

    Background (2026-06-15): teams-for-linux's web app leads its CSS font stack
    with:  -apple-system, BlinkMacSystemFont, "Segoe UI", ..., "Segoe UI Web", sans-serif
    On Linux -apple-system/BlinkMacSystemFont don't resolve, and Teams' bundled
    @font-face for the literal family "Segoe UI" loads in *error* state
    (verified via CDP: document.fonts shows "Segoe UI [400 error]"). So Teams
    falls through to "Segoe UI Web", which has no @font-face and hits fontconfig.
    With no Segoe UI installed, that resolved to Noto Sans -> wrong font.

    Fix: install ttf-segoe-ui-variable (genuine Segoe UI Variable) and map the
    Segoe families Teams asks for to its "Text" optical size (the one Microsoft
    intends for UI body text ~12-28px). "Segoe UI Web" is the alias that actually
    takes effect for Teams; "Segoe UI" is covered too for other apps.

    Verify:  fc-match "Segoe UI Web"  ->  Segoe UI Variable Static Text
  -->
  <alias binding="strong">
    <family>Segoe UI Web</family>
    <prefer><family>Segoe UI Variable Static Text</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Segoe UI</family>
    <prefer><family>Segoe UI Variable Static Text</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Segoe UI Historic</family>
    <prefer><family>Segoe UI Variable Static Text</family></prefer>
  </alias>
</fontconfig>
