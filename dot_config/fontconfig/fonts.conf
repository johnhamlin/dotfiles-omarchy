<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Managed by chezmoi. Based on Omarchy's fonts.conf, with sans-serif and
       system-ui pointed at Inter instead of Liberation Sans.
       REASON (font-breakage-2026-06-11.md): the desktop UI font must be a
       Chromium-loadable TrueType face. Cantarell's CFF2 variable OTF breaks
       Chromium/Skia system-ui fallback (monospace UI text in every
       Chromium/Electron app). Do not point these at Cantarell or Liberation. -->
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="strong"><string>JetBrainsMono Nerd Font</string></edit>
  </match>
  <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>ui-monospace</family><default><family>monospace</family></default></alias>
  <alias><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>sans-serif</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias><family>serif</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias><family>monospace</family><accept><family>Noto Color Emoji</family></accept></alias>
</fontconfig>
