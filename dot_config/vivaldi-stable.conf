--ozone-platform=wayland
--enable-features=WaylandWindowDecorations
# Chromium crash workaround for Wayland color management on Hyprland - see https://github.com/hyprwm/Hyprland/issues/11957
# VA-API disabled 2026-04-16: horizontal-shift flicker on individual WebRTC video tiles in Teams calls (NVDEC+libva-nvidia-driver stride/buffer issue on driver 595). See chromium-nvidia-render-fix.md.
--disable-features=WaylandWpColorManagerV1,VaapiVideoDecoder,VaapiVideoDecodeLinuxGL
