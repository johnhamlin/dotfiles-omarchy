exec-once = uwsm-app -- hypridle
exec-once = uwsm-app -- mako
exec-once = uwsm-app -- waybar
exec-once = uwsm-app -- fcitx5 --disable notificationitem
exec-once = uwsm-app -- swaybg -i ~/.config/hypr/wallpaper.jpg -m fill
exec-once = uwsm-app -- swayosd-server
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = uwsm-app -- hyprsunset
exec-once = power-brightness

# Prevent systemd-logind from intercepting the power button so Hyprland can handle it
exec-once = systemd-inhibit --what=handle-power-key --who="Hyprland" --why="Power menu keybind" --mode=block sleep infinity

# Export env vars for slow app launch fix
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all
