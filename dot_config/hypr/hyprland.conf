# Managed by chezmoi — edit in ~/.local/share/chezmoi/dot_config/hypr/
# Omarchy defaults (do not edit those files; they live in the pinned v3.8.4 clone)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.local/share/omarchy/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# User layer (overrides defaults; later wins)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr-custom/workspaces.conf
source = ~/.config/hypr-custom/appearance.conf
source = ~/.config/hypr-custom/input.conf
source = ~/.config/hypr-custom/envs.conf
source = ~/.config/hypr-custom/autostart.conf
source = ~/.config/hypr-custom/windowrules/base.conf
source = ~/.config/hypr-custom/windowrules/apps.conf

# Omarchy dynamic toggles (contain settings only, no binds — verified v3.8.4)
source = ~/.local/state/omarchy/toggles/hypr/*.conf

# ─── Keymap ──────────────────────────────────────────────────────────
# CHANGED 2026-08-12 (was: Omarchy's binding files deliberately NOT sourced,
# with all ~160 binds hand-copied into hypr-custom — 110 of them byte-identical
# to upstream, so every Omarchy release left this machine behind).
# Full rationale + audit: ~/notes/keybindings-audit-2026-08-12.md
#
# Omarchy's stock keymap comes first. This is the same set a fresh Omarchy
# install sources (see ~/.local/share/omarchy/config/hypr/hyprland.conf).
# Note apps are NOT here: upstream ships those in the *user* file
# ~/.config/hypr/bindings.conf, whose role bindings/apps.conf plays below.
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf

# Then ours. Duplicate binds STACK in Hyprland, so overrides.conf `unbind`s
# every combo it disagrees with before rebinding it. After moving the Omarchy
# pin, run ~/.local/bin/hypr-binds-check to catch new upstream collisions.
#
# overrides.conf MUST stay last: it ends with the SUPER+F12 passthrough
# submap, and any bind after `submap = passthrough` gets swallowed into it.
source = ~/.config/hypr-custom/bindings/apps.conf
source = ~/.config/hypr-custom/bindings/overrides.conf
