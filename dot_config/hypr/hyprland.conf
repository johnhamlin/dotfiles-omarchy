source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/appearance.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/windowrules/base.conf
source = ~/.config/hypr/windowrules/apps.conf
source = ~/.config/hypr/bindings/tiling.conf
source = ~/.config/hypr/bindings/apps.conf
source = ~/.config/hypr/bindings/media.conf
source = ~/.config/hypr/bindings/utilities.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/workspaces.conf

# Thunderbird — float dialog/popup windows (compose, address book, alerts, etc.)
windowrule = float on, match:class .*Thunderbird, match:title ^(Write|Reply|Forward|Edit|Edit Item|Address Book|Calendar Reminders|Reminder|Event|Task|Print|Search Messages|About Mozilla Thunderbird|Create New Calendar|Edit Calendar|Import)
windowrule = size 500 400, match:class .*Thunderbird, match:title ^Calendar Reminders
windowrule = center on, match:class .*Thunderbird, match:title ^Calendar Reminders
windowrule = size 900 700, match:class .*Thunderbird, match:title ^(Write|Reply|Forward|Edit Item)
windowrule = center on, match:class .*Thunderbird, match:title ^(Write|Reply|Forward|Edit Item)

# Thunderbird — remove default opacity (content-heavy app, like browsers)
windowrule = tag -default-opacity, match:class .*Thunderbird
windowrule = opacity 1.0 0.97, match:class .*Thunderbird
