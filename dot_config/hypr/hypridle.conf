# Managed by chezmoi. Policy (desktop — desktop-laptop-cleanup.md):
#  - NO idle auto-lock, NO auto-suspend. Screensaver at 5 min (John's pick
#    2026-07-14), screens off after a further 15 min (OLED care).
# Mechanism (2026-07-14 decision): TRIAL Omarchy's stock lock path
# (omarchy-system-lock: hyprlock + xkb reset + 1Password lock + single
# display-off ~3s after lock) on driver 610.x, instead of the HyDE-era
# lock-screen script + 10x/300ms DPMS retry loop (dpms-lock-screen-fix.md).
# If the NVIDIA DRM page-flip race resurfaces (screens stay on after lock,
# or partial off), revert this file to the retry-loop version in git history.
# Locking still routes through `loginctl lock-session` -> lock_cmd.

general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    after_sleep_cmd = sleep 1 && omarchy-system-wake
    inhibit_sleep = 3
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Screensaver after 5 min idle (no lock). Verified 2026-07-14: the
# screensaver does NOT reset hypridle's idle timer on this setup (Omarchy's
# stock config claims it does) — screens-off fires 900s from last real
# input, preserving the 15-min OLED policy exactly.
listener {
    timeout = 300
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# Screens off 15 min after last input (verified — screensaver does not
# extend this), locked or not. No lock listener by design.
listener {
    timeout = 900
    on-timeout = omarchy-brightness-display off
    on-resume = omarchy-system-wake
}
