# Managed by chezmoi. Policy (dpms-lock-screen-fix.md, desktop-laptop-cleanup.md):
#  - NO idle auto-lock, NO auto-suspend (home desktop).
#  - 900s DPMS-off only (OLED protection), with the NVIDIA retry loop:
#    a single `hyprctl dispatch dpms off` fails intermittently on NVIDIA
#    (DRM page-flip race) — always retry 10x at 300ms.
#  - Locking must route through `loginctl lock-session` so this lock_cmd
#    (which owns DPMS) fires. Omarchy's omarchy-system-lock is NOT used:
#    its display-off is a single unretried dpms off.

general {
    lock_cmd = sh -c '(sleep 3; for i in $(seq 1 10); do hyprctl dispatch dpms off; sleep 0.3; done) & ~/.local/bin/lock-screen'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Screens off after 15 min, whether locked or not. No lock listener by design.
listener {
    timeout = 900
    on-timeout = sh -c 'for i in $(seq 1 10); do hyprctl dispatch dpms off; sleep 0.3; done'
    on-resume = hyprctl dispatch dpms on
}
