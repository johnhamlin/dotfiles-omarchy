# Configuring hypridle
# See: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# hypridle.conf - Hypridle configuration for HyDE
# Handles idle actions: dim, lock, DPMS, suspend, and custom listeners
#
# Listeners: Each listener block defines an idle timeout and actions to run
#
# For more info, see: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

#!      ░▒▒▒░░░▓▓           ___________
#!    ░░▒▒▒░░░░░▓▓        //___________/
#!   ░░▒▒▒░░░░░▓▓     _   _ _    _ _____
#!   ░░▒▒░░░░░▓▓▓▓▓ | | | | |  | |  __/
#!    ░▒▒░░░░▓▓   ▓▓ | |_| | |_/ /| |___
#!     ░▒▒░░▓▓   ▓▓   \__  |____/ |____/
#!       ░▒▓▓   ▓▓  //____/

$UNLOCK_CMD = sh -c 'sleep 3 && pkill -9 $(hyde-shell lockscreen --get)' # kills the lockscreen after 3 seconds for cleanup

general {
    # Start lockscreen, then DPMS off after a short delay.
    # Retry loop works around NVIDIA DRM page-flip race condition where a single
    # `hyprctl dispatch dpms off` fails with "Cannot commit when a page-flip is awaiting".
    # Idle listeners alone can't handle this — fullscreen apps with idle_inhibit prevent them from firing.
    lock_cmd = sh -c '(sleep 3; for i in $(seq 1 10); do hyprctl dispatch dpms off; sleep 0.3; done) & hyde-shell lockscreen.sh'
    unlock_cmd = $UNLOCK_CMD # command when `loginctl unlock-session` is called
    ignore_dbus_inhibit = false             # Ignore dbus idle-inhibit requests (false = respect them)
    ignore_systemd_inhibit = false          # Ignore systemd-inhibit --what=idle (false = respect them)
    # before_sleep_cmd =     # command ran before sleep
    # after_sleep_cmd = # notify-send "Awake!"  # command ran after sleep
}

# // --- Listener: DPMS off after 15min idle ---
# DPMS first so the OLED isn't displaying a static image.
# NOTE: idle auto-lock is intentionally disabled — home desktop, no physical
# access risk. hyprlock has no password-less mode, so "no lockscreen password"
# means simply not invoking lock-session on idle. The manual lock keybind
# (XF86PowerOff → loginctl lock-session) and lock_cmd above are left intact for
# on-demand use.
listener {
    timeout = 900
    on-timeout = sh -c 'for i in $(seq 1 10); do hyprctl dispatch dpms off; sleep 0.3; done'
    on-resume = hyprctl dispatch dpms on
}

# // --- Custom listeners ---
# hyprlang noerror true
# Source any additional listener configs from this path (wildcard supported)
# Note: 'source' command is not implemented yet in hyprlang, but left for future use
source = ./hypridle/*
# hyprlang noerror false
