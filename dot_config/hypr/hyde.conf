# Empty placeholder so HyDE's dynamic.conf source-= directive resolves cleanly.
# HyDE sources $XDG_CONFIG_HOME/hypr/hyde.conf as a fallback for legacy users
# (per ~/.local/share/hypr/dynamic.conf:31). Without this file, Hyprland emits
# `source= globbing error: found no match` on every reload and shows an error
# notification on the desktop. We don't actually use hyde.conf for anything;
# this file just needs to exist.
