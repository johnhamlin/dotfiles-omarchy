# Unbind HyDE defaults that conflict with our keybindings.
# Relocated HyDE features are rebound at the end of this file.

$mainMod = SUPER

# Free up keys for vim navigation (HJKL)
unbind = $mainMod, J                    # HyDE: togglesplit → Ctrl+J
unbind = $mainMod, K                    # HyDE: keyboard layout → dropped (keyd handles)
unbind = $mainMod, L                    # HyDE: lock screen → Super+Escape / Ctrl+L

# Free up keys for universal copy/paste/cut
unbind = $mainMod, C                    # HyDE: text editor → Shift+N
unbind = $mainMod, V                    # HyDE: clipboard → Ctrl+V
unbind = $mainMod, X                    # HyDE: mouse resize alt → dropped

# Free up keys for our app launchers and features
unbind = $mainMod, W                    # HyDE: toggle floating → Super+T
unbind = $mainMod, T                    # HyDE: terminal → Super+Return
unbind = $mainMod, B                    # HyDE: browser → Shift+B
unbind = $mainMod, E                    # HyDE: file explorer → Shift+F
unbind = $mainMod, A                    # HyDE: app finder → Super+Space
unbind = $mainMod, COMMA                # HyDE: emoji picker → Ctrl+E

# Fix workspace cycling behavior (m+1 → e+1)
unbind = $mainMod, Tab                  # HyDE: window switcher → dropped (Alt+Tab cycles)
unbind = $mainMod SHIFT, Tab            # HyDE: reverse switcher → dropped

# Free up Shift combos for app launchers
unbind = $mainMod SHIFT, S              # HyDE: move to scratchpad → Alt+S
unbind = $mainMod SHIFT, left           # HyDE: resize ±30 → brackets
unbind = $mainMod SHIFT, right
unbind = $mainMod SHIFT, up
unbind = $mainMod SHIFT, down
unbind = $mainMod SHIFT, W              # HyDE: select wallpaper → Ctrl+Shift+W
unbind = $mainMod SHIFT, A              # HyDE: rofi selector → Ctrl+Shift+A
unbind = $mainMod SHIFT, Y              # HyDE: select animations → Ctrl+Shift+Y
unbind = $mainMod SHIFT, G              # HyDE: game launcher → Ctrl+Shift+G

# Free up Alt combos for group operations
unbind = $mainMod ALT, G                # HyDE: game mode → Ctrl+G
unbind = $mainMod ALT, 1                # HyDE: silent workspace move → Shift+Alt+1-0
unbind = $mainMod ALT, 2
unbind = $mainMod ALT, 3
unbind = $mainMod ALT, 4
unbind = $mainMod ALT, 5
unbind = $mainMod ALT, 6
unbind = $mainMod ALT, 7
unbind = $mainMod ALT, 8
unbind = $mainMod ALT, 9
unbind = $mainMod ALT, 0

# --- Rebind relocated HyDE features on non-conflicting keys ---

bindd = $mainMod CTRL, J, Toggle window split, layoutmsg, togglesplit
bindd = $mainMod CTRL, G, Toggle game mode, exec, hyde-shell gamemode
bindd = $mainMod CTRL SHIFT, W, Wallpaper selector, exec, hyde-shell wallpaper
bindd = $mainMod CTRL SHIFT, A, Rofi selector, exec, pkill -x rofi || hyde-shell rofilaunch s
bindd = $mainMod CTRL SHIFT, Y, Select animations, exec, hyde-shell animations
bindd = $mainMod CTRL SHIFT, G, Game launcher, exec, pkill -x rofi || hyde-shell rofilaunch g
