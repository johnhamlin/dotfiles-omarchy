# Unbind ML4W defaults that conflict with our keybindings.
# Relocated ML4W features are rebound at the end of this file.

$mainMod = SUPER

# Free up keys for vim navigation
unbind = $mainMod, J                    # ML4W: togglesplit → Ctrl+J
unbind = $mainMod, K                    # ML4W: swapsplit → Ctrl+K
unbind = $mainMod, B                    # ML4W: browser → Shift+B
unbind = $mainMod, E                    # ML4W: filemanager → Shift+F
unbind = $mainMod, M                    # ML4W: maximize → Alt+F
unbind = $mainMod, F                    # ML4W: fullscreen 0 → Ctrl+F
unbind = $mainMod, V                    # ML4W: cliphist → Ctrl+V
unbind = $mainMod, S                    # ML4W: sidepad → Ctrl+Right/Left

# Free up Shift combos for app launchers
unbind = $mainMod SHIFT, H              # ML4W: hyprsunset → Ctrl+N
unbind = $mainMod SHIFT, B              # ML4W: reload waybar → Shift+R
unbind = $mainMod SHIFT, M              # ML4W: light/dark → Ctrl+M
unbind = $mainMod SHIFT, W              # ML4W: wallpaper → Ctrl+Shift+W
unbind = $mainMod SHIFT, A              # ML4W: toggle anim → Ctrl+Shift+A
unbind = $mainMod SHIFT, S              # ML4W: select sidepad
unbind = $mainMod SHIFT, left           # ML4W: resize → brackets
unbind = $mainMod SHIFT, right
unbind = $mainMod SHIFT, up
unbind = $mainMod SHIFT, down

# Free up Alt combos for group operations
unbind = $mainMod ALT, left             # ML4W: swap → Shift+HJKL
unbind = $mainMod ALT, right
unbind = $mainMod ALT, up
unbind = $mainMod ALT, down
unbind = $mainMod ALT, F                # ML4W: instant screenshot → Shift+Print
unbind = $mainMod ALT, S                # ML4W: area screenshot → Print (region)
unbind = $mainMod ALT, G                # ML4W: game mode → Ctrl+G

# Free up Ctrl combos for our control panel bindings
unbind = $mainMod CTRL, T               # ML4W: waybar themes → Ctrl+Shift+T
unbind = $mainMod CTRL, W               # ML4W: wallpaper selector → Ctrl+Shift+W
unbind = $mainMod CTRL, B               # ML4W: toggle waybar → Alt+Space

# Fix workspace cycling behavior (m+1 → e+1)
unbind = $mainMod, Tab
unbind = $mainMod SHIFT, Tab

# --- Rebind relocated ML4W features on non-conflicting keys ---

bindd = $mainMod CTRL, K, Swap split, layoutmsg, swapsplit
bindd = $mainMod CTRL SHIFT, K, Show keybindings, exec, ~/.config/hypr/scripts/keybindings.sh
bindd = $mainMod CTRL, M, Toggle light/dark mode, exec, ~/.config/ml4w/scripts/ml4w-toggle-theme
bindd = $mainMod CTRL, G, Toggle game mode, exec, ~/.config/hypr/scripts/gamemode.sh
bindd = $mainMod CTRL SHIFT, W, Wallpaper selector, exec, ~/.config/ml4w/scripts/ml4w-wallpaper
bindd = $mainMod CTRL SHIFT, T, Waybar theme switcher, exec, ~/.config/waybar/themeswitcher.sh
bindd = $mainMod CTRL SHIFT, A, Toggle animations, exec, ~/.config/hypr/scripts/toggle-animations.sh
