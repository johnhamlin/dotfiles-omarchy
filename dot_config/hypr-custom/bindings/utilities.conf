# App launcher — rofi via HyDE's hyde-shell
bindd = SUPER, SPACE, Launch apps, exec, pkill -x rofi || hyde-shell rofilaunch d
bindd = SUPER CTRL, E, Emoji picker, exec, hyde-shell emoji-picker
bindd = SUPER CTRL, V, Clipboard manager, exec, hyde-shell cliphist -c

# Copy / Paste
bindd = SUPER, C, Universal copy, sendshortcut, CTRL, Insert,
bindd = SUPER, V, Universal paste, sendshortcut, SHIFT, Insert,
bindd = SUPER, X, Universal cut, sendshortcut, CTRL, X,

# Lock
bindd = SUPER, ESCAPE, Lock screen, exec, lock-screen
bindld = , XF86PowerOff, Lock screen, exec, lock-screen
bindd = SUPER CTRL, L, Lock screen, exec, lock-screen

# Screenshots
bindd = , PRINT, Screenshot, exec, hyprshot -m region
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# Waybar — delegate to HyDE's hyde-shell if available
bindd = SUPER ALT, SPACE, Toggle top bar, exec, toggle-waybar

# Aesthetics
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle

# Notifications — dunst (replaces swaync on ML4W)
bindd = SUPER, COMMA, Close notification, exec, dunstctl close
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, dunstctl close-all
bindd = SUPER CTRL, COMMA, Toggle do-not-disturb, exec, dunstctl set-paused toggle
bindd = SUPER ALT, COMMA, Show last notification, exec, dunstctl history-pop

# Toggles
bindd = SUPER CTRL, I, Toggle locking on idle, exec, pidof hypridle && pkill hypridle || uwsm-app -- hypridle
bindd = SUPER CTRL, N, Toggle nightlight, exec, pidof hyprsunset && pkill -x hyprsunset || uwsm-app -- hyprsunset

# Control panels
bindd = SUPER CTRL, A, Audio controls, exec, uwsm-app -- pavucontrol
bindd = SUPER CTRL, B, Bluetooth controls, exec, uwsm-app -- blueman-manager
bindd = SUPER CTRL, W, Wifi controls, exec, uwsm-app -- nm-connection-editor
bindd = SUPER CTRL, T, Activity, exec, uwsm-app -- xdg-terminal-exec -e btop

# Dictation
bindd = SUPER CTRL, X, Toggle dictation, exec, voxtype record toggle

# Zoom
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# Information
bindd = SUPER CTRL, K, Search keybindings, exec, pkill -x rofi || hyde-shell keybinds_hint c
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send "    $(date +"%A %H:%M  —  %d %B W%V %Y")"
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Hardware toggles
bindd = SUPER SHIFT, I, Toggle internal keyboard, exec, toggle-internal-keyboard
