# Autostart additions only — Omarchy's default autostart.conf already starts:
# hypridle, mako, waybar, fcitx5, swaybg, polkit-gnome, import-environment.
# swayosd runs as a systemd user service (swayosd-server.service).

# Prevent systemd-logind from intercepting the power button so Hyprland can handle it
exec-once = systemd-inhibit --what=handle-power-key --who="Hyprland" --why="Power menu keybind" --mode=block sleep infinity
