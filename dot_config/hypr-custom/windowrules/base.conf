# Suppress maximize for all windows
windowrule = suppress_event maximize, match:class .*

# Tag all windows for default opacity (apps can opt out with -default-opacity)
windowrule = tag +default-opacity, match:class .*

# Force full opacity — overrides Omarchy's default 0.97/0.9 translucency
# (windows.conf, sourced earlier). Translucent text reads as blurry —
# John wants everything fully opaque, always (2026-07-14). No toggle.
windowrule = opacity 1.0 1.0, match:tag default-opacity

# Default fullscreen state (compositor fullscreen; client thinks "normal")
windowrule = fullscreen 2 0

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
